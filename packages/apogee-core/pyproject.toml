[project]
name = "apogee-core"
version = "0.1.0"
description = "APOGEE core ascent dynamics (pure physics)"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "diffrax",
    "ussa1976",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apogee_core"]
