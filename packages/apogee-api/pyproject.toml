[project]
name = "apogee-api"
version = "0.1.0"
description = "FastAPI backend for rocket launch and orbital simulations"
readme = "README.md"
authors = [
    { name = "Dax", email = "daxnavarrete@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "apogee-launch",
    "apogee-orbit",
]

[build-system]
requires = ["uv_build>=0.9.21,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
apogee-launch = { workspace = true }
apogee-orbit = { workspace = true }
